[package]
name = "barq"
version = "0.1.2"
edition = "2021"
description = "Interactive visualization of microcontroller Flash and RAM contents from ELF files"
license = "AGPL-3.0-or-later"
readme = "../README.md"

[dependencies]
object = { version = "0.36", default-features = false, features = ["read", "elf"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
rustc-demangle = "0.1"
